name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

  playwright:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build
        env:
          # Homepage demos are runtime-gated; keep CI env consistent for next start.
          SWEEP_ALLOW_DEMO: "1"

      - name: Run Playwright
        run: pnpm test:e2e
        env:
          CI: "1"
          SWEEP_ALLOW_DEMO: "1"
          # Many demo opens across projects; avoid process-local rate-limit stalls.
          SWEEP_RATE_LIMIT: "100"
          SWEEP_RATE_WINDOW_MS: "60000"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
